name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-7ca67a1a-aou3k9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/
          # stamp this deploy with the short commit code so the in-game version label shows exactly which build is live
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/index.html
          cp -r assets _site/
          if [ -d sounds ]; then cp -r sounds _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
