<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dumpster Divers</title>
<style>
  :root { color-scheme: dark; --ink:#f4ead2; --accent:#ffcf4a; --panel:rgba(12,14,26,.9); }
  html, body { margin:0; height:100%; background:#07080f; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(100vw, 56.25vh); aspect-ratio:9/16;
    font-size:max(9px, calc(min(100vw, 56.25vh) / 36)); }
  @supports (height:100dvh) { #wrap { width:min(100vw, 56.25dvh); font-size:max(9px, calc(min(100vw, 56.25dvh) / 36)); } }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(5,6,14,.62); overflow:auto; }
  #overlay.hidden { display:none; }
  .card { background:var(--panel); border:.2em solid #3a3f66; border-radius:1em; padding:1.3em 1.5em;
    width:min(30em, 94%); max-height:96%; overflow:auto; box-sizing:border-box; color:var(--ink);
    text-align:center; box-shadow:0 1em 3em rgba(0,0,0,.6); }
  h1 { margin:0 0 .15em; font-size:2.2em; letter-spacing:.04em; color:var(--accent);
    text-shadow:.07em .07em 0 #7a3b00, 0 0 .6em rgba(255,207,74,.35); }
  .sub { margin:0 0 .9em; opacity:.8; font-size:1em; }
  .result { margin:.2em 0 .9em; padding:.7em .9em; background:rgba(255,255,255,.07); border-radius:.6em; line-height:1.45; }
  .result b { color:var(--accent); }
  .cash { font-size:1.5em; font-weight:800; margin:.3em 0 .5em; }
  .cash span { color:#7dffa0; }
  .row { display:flex; align-items:center; gap:.8em; text-align:left; padding:.6em .7em; margin:.45em 0;
    background:rgba(255,255,255,.06); border-radius:.7em; }
  .row .nm { flex:1; } .row .nm b { display:block; font-size:1.1em; }
  .row .nm small { opacity:.7; font-size:.82em; display:block; }
  .bar { height:.5em; background:rgba(255,255,255,.12); border-radius:.3em; margin-top:.4em; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .lv { font-size:.8em; opacity:.85; margin-top:.25em; }
  button { font:inherit; cursor:pointer; border:0; border-radius:.6em; padding:.6em 1em; font-weight:800; color:#1b1200;
    background:var(--accent); box-shadow:0 .2em 0 #a56a00; }
  button:active { transform:translateY(.15em); box-shadow:0 .05em 0 #a56a00; }
  button:disabled { background:#555a70; color:#aab; box-shadow:none; cursor:not-allowed; }
  .row button { min-width:4.8em; }
  .row.prestige { background:rgba(255,207,74,.1); border:.12em solid rgba(255,207,74,.45); margin-top:.9em; }
  .go { display:block; width:100%; margin-top:.9em; font-size:1.5em; padding:.55em; background:#7dffa0; box-shadow:0 .2em 0 #2f8f4c; }
  .hint { margin-top:.8em; opacity:.7; font-size:.82em; line-height:1.4; }
  .reset { margin-top:.6em; background:none; box-shadow:none; color:#99a; font-weight:500; font-size:.75em; padding:.2em; text-decoration:underline; }
  #title { position:absolute; inset:0; background:#0b1036; overflow:hidden; }
  #title.hidden { display:none; }
  /* portrait art, same shape as the game column, fills the whole screen */
  #title .art { position:absolute; inset:0; }
  #title .art img { width:100%; height:100%; object-fit:cover; object-position:50% 50%; display:block; }
  #title .cta { position:absolute; left:0; right:0; top:54%; display:flex; flex-direction:column; align-items:center; }
  #start { font-size:2em; padding:.5em 1.6em; background:#7dffa0; box-shadow:0 .2em 0 #2f8f4c; letter-spacing:.06em;
    animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.05); } }
  #title .tip { margin-top:1.1em; color:var(--ink); font-size:.9em; text-align:center; line-height:1.5; text-shadow:0 .1em .3em #000;
    background:rgba(5,6,14,.62); padding:.5em .9em; border-radius:.7em; }
  .ach-btn { display:block; width:100%; margin-top:.7em; background:rgba(255,255,255,.1); color:var(--ink); box-shadow:none; border:.1em solid rgba(255,255,255,.28); font-size:1.05em; }
  details.achcat { background:rgba(255,255,255,.06); border-radius:.7em; margin:.45em 0; padding:.6em .75em; text-align:left; }
  details.achcat.complete { background:rgba(125,255,160,.1); }
  details.achcat summary { cursor:pointer; list-style:none; } details.achcat summary::-webkit-details-marker { display:none; }
  .achhead { display:flex; justify-content:space-between; gap:.6em; } .achhead b { font-size:1.05em; } .achhead span { opacity:.8; }
  details.achcat .it { padding:.35em 0 .1em; border-top:.06em solid rgba(255,255,255,.08); margin-top:.4em; }
  details.achcat .it b { display:block; font-size:.95em; } details.achcat .it small { opacity:.7; display:block; font-size:.8em; }
  details.achcat .it.done b { color:#7dffa0; } details.achcat .it.lock { opacity:.6; }
  #title .ver { position:absolute; left:0; right:0; bottom:.7em; text-align:center; font-size:.8em; color:#fff; opacity:.75; text-shadow:0 .1em .3em #000, 0 0 .5em #000; letter-spacing:.03em; }
  .verline { opacity:.7; font-size:.95em; }
  #mute { position:absolute; right:.6em; top:.6em; z-index:5; padding:.3em .55em; font-size:1.2em; background:rgba(0,0,0,.45);
    color:#fff; box-shadow:none; border-radius:.5em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="450" height="800"></canvas>
  <button id="mute" title="Sound on/off" aria-label="Toggle sound">🔊</button>
  <div id="overlay" class="hidden"><div class="card" id="card"></div></div>
  <div id="title">
    <div class="art"><img src="assets/title-portrait.jpg" alt="Dumpster Divers: a Viperbot game" draggable="false"></div>
    <div class="ver" id="ver"></div>
    <div class="cta">
      <button id="start">START</button>
      <div class="tip">Bounce the hobos, grab the junk, don’t hit the pavement.<br>Steer with your mouse, finger, or ← → keys.</div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================== constants */
/* Version: MAJOR.MINOR.PATCH. The leading 0 means BETA and stays 0 until the game leaves beta.
   Bump MINOR for new features and PATCH for fixes. BUILD is stamped with the commit code by the deploy workflow
   (it shows "dev" when running locally), so a phone can tell exactly which build it has loaded. */
const VERSION = '0.12.3', BUILD = '__BUILD__';
const versionText = () => `v${VERSION} beta · build ${BUILD.startsWith('__') ? 'dev' : BUILD} · ${audioStatus()}`;

const W = 450, H = 800;           // tall + narrow playfield, same on every device
const DTOP = 670;                 // world y of the dumpster rim (the world scrolls UP from here)
const GROUND = 756;
const GRAV = 1000;
const HR = 15;                    // hobo collision radius
const MAX_LV = 25;
const CLONE_CAP = 6;
const HAZARD_AFTER = 15;          // hazards (the things that bump you around) only appear after this many bounces
const CLONE_HOPS = Infinity;       // no cap: the hole keeps bouncing a clone back up until it misses and splats
const CLONE_GRAVITY = .7;         // clones fall at 70% gravity: a longer, floatier life
const PU_TIME = 10;               // seconds for timed power-ups
const BUMP_WILD = 320, BUMP_WILD_CAP = 1150;   // odd obstacle hits: the extra shove and the speed limit (was 240 / 950)
const BUMP_EASE_X = .35, BUMP_EASE_Y = .8;      // even obstacle hits keep this fraction of his sideways / vertical speed
const TURBO_KEY_V = 900;         // turbo: arrow-key speed in px/s (about half a second to cross the screen)
const TURBO_SLIDE = 4500;         // turbo: how fast the dumpster slides to the cursor/finger (px/s), i.e. near-instant
const FLING = 4;                  // launch sideways speed per px landed off-centre

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const opp = s => (s === 'L' ? 'R' : 'L');
const wrapX = x => ((x % W) + W) % W;
const wd = (a, b) => { let d = (a - b) % W; if (d > W / 2) d -= W; if (d < -W / 2) d += W; return d; }; // shortest signed a-b on the ring

const HOBOS = [
  { name: 'Gutter Gary', pal: { coat:'#4c9a47', coat2:'#2f6b2f', hat:'#2f6b2f', hat2:'#7bd36f', pants:'#6b5a3a', shoe:'#2a2118', skin:'#e2b58c', patch:'#e8d36a' } },
  { name: 'Dumpy Dave',  pal: { coat:'#c8483a', coat2:'#8c2c22', hat:'#e8b923', hat2:'#fff1a8', pants:'#34518a', shoe:'#1c1c26', skin:'#b9835a', patch:'#6fb0e0' } },
];
const CLONE_PALS = [
  { coat:'#7b52c9', coat2:'#523591', hat:'#f08ad0', hat2:'#ffd1ef', pants:'#3a3a52', shoe:'#1c1c26', skin:'#e2b58c', patch:'#ffe27a' },
  { coat:'#e08a2c', coat2:'#a35d14', hat:'#2c6fb5', hat2:'#9ccbff', pants:'#55483a', shoe:'#201a14', skin:'#c4916a', patch:'#7dffa0' },
  { coat:'#2c9aa8', coat2:'#1b6670', hat:'#c8483a', hat2:'#ffb3a8', pants:'#2e3d57', shoe:'#14161e', skin:'#a8714a', patch:'#fff' },
  { coat:'#d65a8f', coat2:'#9a3563', hat:'#3a3a52', hat2:'#9a9ab8', pants:'#4a6b3a', shoe:'#1c1c26', skin:'#efc9a4', patch:'#ffe27a' },
];

/* ============================================================== save data */
const SAVE_KEY = 'dumpsterDivers.v3';
let S = { cash: 0, speed: 0, height: 0, hole: 0, rocket: 0, net: 0, turbo: 0, bestCash: 0, bestAlt: 0, bestZone: 0, zonesClaimed: [], ach: {}, stats: {}, achBackfill: false, prestige: 0, muted: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// Upgrades are deliberately small per level: you feel them after a few, not after one.
// Each one has its own number of levels (max) and a price that grows from `base` to `top`.
// Prices were fitted with a simulated bot so the first cycle takes roughly: 10 min to 10% of the shop,
// 3 h to 50%, ~30 h to 100%. The exponent COST_P < 1 front-loads the price a little, so the early game isn't instant.
const COST_P = .45;
const UPGRADES = [
  { id: 'speed',  name: 'Dumpster Speed',  desc: 'Gets moving sooner and goes a bit faster',                  max: 60,  base: 35, top: 90000 },
  { id: 'height', name: 'Launch Height',   desc: 'Raises how high the bounces can build up to',               max: 100, base: 50, top: 750000 },
  { id: 'hole',   name: 'Bigger Dumpster', desc: 'A wider dumpster is easier to land in, but edge landings fling wilder', max: 40, base: 30, top: 45000 },
  { id: 'rocket', name: 'Rocket Burn',     desc: 'Rockets burn longer. While one burns you smash anything in your way', max: 45, base: 45, top: 150000 },
  { id: 'net',    name: 'Safety Net',      desc: 'The net under the dumpster lasts longer',                   max: 40,  base: 30, top: 30000 },
  { id: 'turbo',  name: 'Turbo Time',      desc: 'Turbo Dumpster (instant steering) lasts longer',            max: 40,  base: 35, top: 45000 },
];
const costOf = u => Math.round(u.base * Math.pow(u.top / u.base, Math.pow((S[u.id] || 0) / (u.max - 1), COST_P)));
const burnOf = lv => .5 + .1 * lv;            // rocket burn seconds: 0.5 s -> 5.0 s over 45 upgrades
const netOf  = lv => 10 + .5 * lv;            // safety net seconds: 10 s -> 30 s over 40 upgrades
const turboOf = lv => 5 + .25 * lv;           // turbo dumpster seconds: 5 s -> 15 s over 40 upgrades
const THRUST_V = 900;                         // rocket climb speed (px/s); if you are already faster you keep your speed

function stats() {
  return {
    accel:  150 * (1 + .045 * S.speed),
    maxV:   140 * (1 + .03 * S.speed),
    decel: 150 * (1 + .045 * S.speed) * 1.35,
    hole:   112 + 1.8 * S.hole,        // dumpster width (each flap/hole is half of it)
    burn:   burnOf(S.rocket || 0),
    netTime: netOf(S.net || 0),
    turboTime: turboOf(S.turbo || 0),
  };
}

/* Height: the first dive is low, and every landing in the dumpster launches the next hobo higher,
   easing toward a ceiling. The Height upgrade raises the starting speed a little and the ceiling a lot. */
const launchStart = lv => 600 + 8 * lv;
const launchMax   = lv => 950 + 70 * lv;          // 100 levels: ~3,160 m at the top, just past the moon
const apexOf = v => v * v / (2 * GRAV);
const BUILDUP = .82;                                   // each landing closes 18% of the gap to the ceiling
function launchFrac(streak) { return 1 - Math.pow(BUILDUP, streak); }
function launchSpeed(streak) { return lerp(launchStart(S.height), launchMax(S.height), launchFrac(streak)); }

/* Prestige: pay money to be promoted. Upgrades and stash reset to zero; records and achievements stay.
   Each rank is a permanent +25% income, so the next climb goes further than the last. */
const MULT_STEP = .25;
const RANKS = ['Dumpster Rookie', 'Trash Pro', 'Garbage Guru', 'Dumpster King', 'Alley Legend', 'Moon Hobo', 'Cosmic Hobo'];
const rankName = n => RANKS[n] || `${RANKS[RANKS.length - 1]} ${n - RANKS.length + 2}`;
const multAt = n => 1 + MULT_STEP * n;
const incomeMult = () => multAt(S.prestige || 0);
const prestigeCost = n => Math.round(25000 * Math.pow(1.7, n));   // $25k for the first, then 1.7x each time
const money = n => Math.floor(n).toLocaleString('en-US');

/* ============================================================== zones */
// The sky changes as you climb. m = metres above the dumpster rim (10 px = 1 m).
const ZONES = [
  { name: 'The Alley',     m: 0,    bonus: 0 },
  { name: 'The Clouds',    m: 50,   bonus: 400,    sub: 'The city is getting small' },
  { name: 'The Upper Sky', m: 150,  bonus: 2500,   sub: 'Planes and choppers up here' },
  { name: 'Space',         m: 500,  bonus: 15000,  sub: 'No air, no problem' },
  { name: 'The Moon',      m: 3000, bonus: 100000, big: 'ONE GIANT LEAP', sub: 'Dumpster divers on the moon!' },
];
const zoneAt = altPx => { let z = 0; for (let i = 0; i < ZONES.length; i++) if (altPx / 10 >= ZONES[i].m) z = i; return z; };
const MOON_R = 700, MOON_ALT = 30000 + MOON_R;       // the moon's bottom edge sits at 3,000 m

/* ============================================================== canvas */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
}
window.addEventListener('resize', resize); resize();

/* ---- background: the alley (pre-rendered), a space gradient above it, and parallax stars */
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
const stars = document.createElement('canvas'); stars.width = W; stars.height = H;
const moonImg = document.createElement('canvas'); moonImg.width = MOON_R * 2; moonImg.height = MOON_R * 2;
(function paintMoon() {
  const c = moonImg.getContext('2d'), R = MOON_R; let seed = 99; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = c.createRadialGradient(R * .8, R * .75, R * .1, R, R, R);
  g.addColorStop(0, '#f4f1e6'); g.addColorStop(.7, '#cfccc0'); g.addColorStop(1, '#8d8b84');
  c.fillStyle = g; c.beginPath(); c.arc(R, R, R, 0, 7); c.fill();
  c.save(); c.beginPath(); c.arc(R, R, R, 0, 7); c.clip();
  for (let i = 0; i < 60; i++) {
    const r = 12 + rnd() * rnd() * 110, x = rnd() * R * 2, y = rnd() * R * 2;
    c.fillStyle = 'rgba(90,88,80,.28)'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.beginPath(); c.arc(x - r * .08, y - r * .08, r, Math.PI * .9, Math.PI * 1.7); c.stroke();
  }
  c.restore();
})();
(function paintBackground() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const c = bg.getContext('2d'); c.scale(2, 2);
  const WALL = GROUND - 136;
  const sky = c.createLinearGradient(0, 0, 0, WALL);
  sky.addColorStop(0, '#0b0e2c'); sky.addColorStop(.6, '#3a2459'); sky.addColorStop(1, '#a5506a');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(255,255,255,${.25 + rnd() * .6})`; c.fillRect(rnd() * W, rnd() * 420, 1.6, 1.6); }
  const moon = c.createRadialGradient(350, 110, 8, 350, 110, 80);
  moon.addColorStop(0, 'rgba(255,248,214,.95)'); moon.addColorStop(.35, 'rgba(255,248,214,.25)'); moon.addColorStop(1, 'rgba(255,248,214,0)');
  c.fillStyle = moon; c.fillRect(250, 10, 200, 200);
  c.fillStyle = '#fff6d2'; c.beginPath(); c.arc(350, 110, 24, 0, 7); c.fill();
  for (const [col, lo, hi] of [['#1d1a3d', 130, 330], ['#15162e', 90, 260]]) {
    for (let x = -10; x < W; ) {
      const bw = 34 + rnd() * 40, bh = lo + rnd() * (hi - lo);
      c.fillStyle = col; c.fillRect(x, WALL + 10 - bh, bw, bh + 60);
      if (col === '#15162e') for (let wy = WALL + 10 - bh + 12; wy < WALL - 8; wy += 18) for (let wx = x + 6; wx < x + bw - 8; wx += 14)
        if (rnd() < .28) { c.fillStyle = rnd() < .8 ? '#f0c85a' : '#8fd0ff'; c.fillRect(wx, wy, 6, 8); }
      x += bw + 2;
    }
  }
  c.fillStyle = '#4a3038'; c.fillRect(0, WALL, W, GROUND - WALL);
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 1;
  for (let y = WALL, row = 0; y < GROUND; y += 14, row++) {
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    for (let x = (row % 2) * 20; x < W; x += 40) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 14); c.stroke(); }
  }
  const fade = c.createLinearGradient(0, WALL, 0, GROUND);
  fade.addColorStop(0, 'rgba(0,0,0,.35)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = fade; c.fillRect(0, WALL, W, GROUND - WALL);
  c.fillStyle = '#23242e'; c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = '#34364a'; c.fillRect(0, GROUND, W, 4);
  c.fillStyle = 'rgba(255,255,255,.07)';
  for (let i = 0; i < 30; i++) c.fillRect(rnd() * W, GROUND + 8 + rnd() * 30, 3 + rnd() * 8, 1.5);
  const s = stars.getContext('2d');
  for (let i = 0; i < 90; i++) { s.fillStyle = `rgba(255,255,255,${.3 + rnd() * .7})`; const z = rnd() < .2 ? 2.2 : 1.4; s.fillRect(rnd() * W, rnd() * H, z, z); }
})();

/* ============================================================== audio */
// Every game event has a named sound hook. Right now they are tiny synth beeps. To use a real sound
// file, set e.g.  SOUNDS.splat = 'sounds/splat.mp3'  and that file plays instead.
const SOUNDS = {};
const _audioCache = {};
let ac = null, audioReady = false;
function audio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if (ac) ac.onstatechange = () => { const v = document.getElementById('ver'); if (v) v.textContent = versionText(); };
  }
  if (ac && ac.state !== 'running') { try { ac.resume(); } catch (e) {} }    // iPhones/iPads keep it 'suspended' (or 'interrupted') until a tap
  if (ac && !banksLoadStarted) loadBanks();                                    // (loads the recorded sound banks, if the files exist)
  if (!audioReady && ac) {                                                    // the very first tap: the iOS unlock tricks
    audioReady = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // iOS 17+: the Ring/Silent switch no longer mutes the game
    try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); } catch (e) {}   // a silent blip to wake the audio engine
  }
  primeThrustAudio();
}
function audioStatus() {                                                      // shown next to the version label, so a tester can tell us what their phone says
  if (!(window.AudioContext || window.webkitAudioContext)) return 'sound unavailable';
  if (S.muted) return 'sound off';
  if (!ac) return 'tap for sound';
  return ac.state === 'running' ? 'sound on' : 'tap to enable sound';
}
function tone(f, d, type = 'square', vol = .06, slide = 0, delay = 0) {
  if (!ac || S.muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .03);
}
function playFile(name) {
  const url = SOUNDS[name]; if (!url || S.muted) return false;
  try { const a = (_audioCache[name] || (_audioCache[name] = new Audio(url))).cloneNode(); a.volume = .8; a.play().catch(() => {}); return true; }
  catch (e) { return false; }
}
const synth = {
  launch()     { tone(200, .28, 'square', .07, 520); },
  jump()       { tone(300, .15, 'square', .05, 300); },
  coin()       { tone(880, .08, 'square', .045); tone(1320, .12, 'square', .045, 0, .07); },
  coinRare()   { tone(660, .1, 'triangle', .07); tone(990, .1, 'triangle', .07, 0, .08); tone(1480, .22, 'triangle', .07, 0, .16); },

/* Sound banks: an effect with several recorded variations (sounds/<name>1.mp3 .. <name>4.mp3). Each time it fires, one is picked at random
   (never the same twice in a row), plays all the way through, and ones that land close together simply layer. They are decoded into the audio
   engine so a fresh copy can start at any moment (this also works on iPhones). Until a bank's files exist, the placeholder beep plays instead.
   `vol` is each bank's loudness; the files themselves were levelled so each bank's variations match. */
const BANKS = {
  bolt:  { files: [1, 2, 3, 4].map(n => `sounds/bolt${n}.mp3`),  vol: .8, buffers: [], last: -1 },     // lightning strike
  splat: { files: [1, 2, 3, 4].map(n => `sounds/splat${n}.mp3`), vol: .8, buffers: [], last: -1 },     // your hobo hits the pavement (about 5 dB quieter than lightning)
  csplat: { files: [1, 2, 3, 4].map(n => `sounds/csplat${n}.mp3`), vol: .8, buffers: [], last: -1 },   // a CLONE's splat: the same four, pitched up a fifth (chipmunk), same length and same loudness
};
let banksLoadStarted = false;
function loadBanks() {
  if (banksLoadStarted || !ac) return; banksLoadStarted = true;
  for (const bank of Object.values(BANKS)) for (const url of bank.files) {
    fetch(url).then(r => (r.ok ? r.arrayBuffer() : Promise.reject()))
      .then(buf => new Promise((res, rej) => ac.decodeAudioData(buf, res, rej)))          // (the callback form also works on older Safari)
      .then(b => bank.buffers.push(b)).catch(() => {});                                       // a missing file is simply skipped
  }
}
function playBank(name, volMul = 1) {                        // volMul: play this one quieter or louder than the bank's normal level
  const bank = BANKS[name], bufs = bank.buffers;
  if (S.muted || !ac || !bufs.length) return false;
  let i; do { i = (Math.random() * bufs.length) | 0; } while (bufs.length > 1 && i === bank.last);
  bank.last = i;
  const src = ac.createBufferSource(), g = ac.createGain(); src.buffer = bufs[i]; g.gain.value = bank.vol * volMul;
  src.connect(g); g.connect(ac.destination); src.start(0);
  return true;
}
const boltBuffers = BANKS.bolt.buffers, playBolt = () => playBank('bolt');
sfx.bolt = () => { if (!playBank('bolt')) synth.bolt(); };

/* Rocket fire: a seamless loop (sounds/thrust.mp3). It plays for as long as the hobo the camera is on is burning,
   however short or long the burn is, and fades out when the burn ends. A second rocket refreshing the burn, or the
   camera moving to another burning hobo, just keeps the loop going. After the main hobo splats it follows the focused clone. */
const THRUST_VOL = .72, THRUST_FADE_MS = 400;       // rocket fire loudness (was .85; lowered 15%)
let thrustA = null, thrustOn = false, thrustFade = null, thrustPrimed = false, thrustPriming = false;
fetch('sounds/thrust.mp3', { method: 'HEAD' }).then(r => { if (r.ok && !SOUNDS.thrust) SOUNDS.thrust = 'sounds/thrust.mp3'; }).catch(() => {});
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
/* iPhones only let a page play an audio element later if that same element was started once inside a tap. So on the first
   tap we "play" a silent clip on the ONE element the rocket sound uses; when a rocket needs it, we just swap in the real file. */
function primeThrustAudio() {
  if (thrustPrimed || thrustPriming) return;
  thrustPriming = true;
  try {
    if (!thrustA) thrustA = new Audio();
    thrustA.src = SILENT_WAV; thrustA._url = SILENT_WAV; thrustA.loop = false;
    const done = ok => { thrustPriming = false; if (ok) thrustPrimed = true; try { thrustA.pause(); } catch (e) {} };
    const pr = thrustA.play(); if (pr && pr.then) pr.then(() => done(true)).catch(() => done(false)); else done(true);
  } catch (e) { thrustPriming = false; }
}

  const url = SOUNDS.thrust; if (!url || S.muted) return;
  if (!thrustA) thrustA = new Audio();
  if (thrustA._url !== url) { thrustA.src = url; thrustA._url = url; thrustA.loop = true; }
  clearInterval(thrustFade); thrustFade = null;
  if (thrustA.paused) { try { thrustA.currentTime = 0; } catch (e) {} }     // a fresh start; if it was still fading out, just bring the volume back and carry on
  thrustA.volume = THRUST_VOL; thrustA.play().catch(() => {}); thrustOn = true;
}
function stopThrustSound(fast) {                      // fade out (a quick cut when you mute)
  if (!thrustOn) return; thrustOn = false;
  const a = thrustA, ms = fast ? 60 : THRUST_FADE_MS, t0 = performance.now(), v0 = a.volume; clearInterval(thrustFade);
  thrustFade = setInterval(() => {

}

    for (const c of G.clones) pool.push(DTOP - c.y);

  // half the loot appears around the hobo, half anywhere along the climb he can reach
  const reach = Math.max(500, apexOf(launchSpeed(G ? G.streak : 0)) * 1.05);
  let alt = prefill ? ref : (Math.random() < .5 ? ref + rand(-420, 300) : rand(80, reach));
  if (alt < 80) alt = 80 + rand(0, 260);

  const roll = Math.random();
  const zn = zoneAt(alt);
  const hz = G.catches >= HAZARD_AFTER ? ZONE_HAZ_CHANCE[zn] : 0, bs = clamp((alt - 300) / 1500, 0, .05);
  const o = { x: 0, y0: DTOP - alt, y: DTOP - alt, vx: 0, ph: rand(0, 6.28), bobF: rand(1.2, 2.6), bobA: rand(3, 8), age: 0, cd: 0 };
  if (!prefill && roll < hz) {
    const hd = pick(ZONE_HAZ[zn]);
    Object.assign(o, { kind: 'haz', e: hd.e, r: hd.r, tier: 9, vx: hd.slow ? rand(55, 100) : rand(80, 170) });
  } else if (!prefill && roll < hz + bs) {
    Object.assign(o, { kind: 'boost', e: '🚀', r: 19, tier: 9, vx: rand(70, 120) });

/* ============================================================== power-ups */
function earn(n) { const g = n * incomeMult(); G.cash += g; return g; }   // every payout goes through here so the prestige multiplier applies
function dupBonus(x, y) {

      statAdd('lightning'); strikeLightning(h, isMain, ox, oy);

      G.turboT = ST.turboTime; break;
    case 'saver':

/* ============================================================== lightning
   A bolt cracks down a random column of what is currently on screen, with zigzags and one or two branches.
   Everything visible that it touches is taken: loot is collected, other power-up capsules are applied, hazards are destroyed. */
const BOLT_R = 34;                                  // how close (px) an object must be to the bolt to be hit

  const pts = [], n = 8; let x = xc;

}

      if (!isMain) hudFloat(`+$${gain}`, '#cfc6ff');

  else floatText(ox, oy - 20, `LIGHTNING! ${hits} hit${hits === 1 ? '' : 's'}`, '#cfc6ff');

/* ============================================================== hobo physics (main hobo and clones share it) */
function physics(h, dt) {
  h.t += dt; h.cd = Math.max(0, h.cd - dt);

  if (h.thrust > 0) {                               // ROCKET BURN: gravity is off and he climbs at least THRUST_V; faster launches keep their speed
    h.thrust -= dt;
    if (h.vy > -THRUST_V) h.vy = -THRUST_V;
  } else {
    let g = GRAV * (h.gs || 1);                     // clones float a little (gs < 1) so they last longer
    if (h.chute === 'open') g = GRAV * .22;
    h.vy += g * dt;
    if (h.chute === 'open') h.vy = Math.min(h.vy, 240);
  }
  if (h.thrust > 0 && G.parts.length < 400 && Math.random() < .55)          // exhaust trail
    G.parts.push({ x: h.x + rand(-5, 5), y: h.y + 16, vx: rand(-40, 40), vy: rand(80, 220), life: .45, max: .45, c: pick(['#ffb347', '#ff6a3d', '#ffe27a']), s: rand(3, 6) });

  if (h.x < HR) { h.x = HR; h.vx = Math.abs(h.vx); }

}
function touchObjects(h, isMain) {
  for (let i = G.objs.length - 1; i >= 0; i--) {
    const o = G.objs[i];
    if (!o || o.dead) continue;                       // (a lightning strike can remove several objects at once)
    if (o.kind === 'haz' && o.cd > 0) continue;
    const dx = o.x - h.x, dy = o.y - h.y, rr = HR + o.r - 4;
    if (dx * dx + dy * dy > rr * rr) continue;
    if (o.kind === 'item') {
      const gain = Math.round(earn(o.v * (isMain ? multiplier() : 1))); statAdd('items');
      floatText(o.x, o.y - 10, `+$${gain}`, isMain ? '#7dffa0' : '#c8ffda');
      if (!isMain) hudFloat(`+$${gain}`, '#c8ffda');
      burst(o.x, o.y, 10, ['#ffe27a', '#fff', '#7dffa0'], 200, .5);
      (o.tier >= 2 ? sfx.coinRare : sfx.coin)();
      G.objs.splice(i, 1);
    } else if (o.kind === 'pu') {
      applyPowerUp(o.id, h, isMain, o.x, o.y);
      burst(o.x, o.y, 14, ['#9ad8ff', '#fff', '#ffe27a'], 220, .5);
      G.objs.splice(i, 1);
    } else if (o.kind === 'boost') {                            // a rocket: burn for ST.burn seconds (a second one refreshes the timer)

      h.chute = null; statAdd('rockets');

      floatText(o.x, o.y - 14, 'ROCKET!', '#ff9a4a');
      G.objs.splice(i, 1);
    } else if (o.kind === 'haz' && h.thrust > 0) {              // burning: the hazard gets SMASHED instead of bumping you
      if (o.e === '🛸') achUnlock('ufo:1', 'UFO Contact');
      const z = zoneAt(DTOP - o.y), gain = Math.round(earn(10 * (1 + z)));
      burst(o.x, o.y, 26, ['#ff9a4a', '#ffe27a', '#fff', '#ff6a3d'], 320, .7); sfx.smash();
      floatText(o.x, o.y - 18, `SMASH! +$${gain}`, '#ffb347'); if (!isMain) hudFloat(`+$${gain}`, '#ffb347');
      G.shake = Math.max(G.shake, .3);

      if (wild) {

        const tilt = rand(-.2, .2), cs = Math.cos(tilt), sn = Math.sin(tilt);          // a small random twist in the direction he is thrown (up to about 11 degrees)

      if (o.e === '🛸') achUnlock('ufo:1', 'UFO Contact');
      burst(h.x, h.y, 10, ['#ff9a7a', '#fff'], 220, .4); sfx.hazard();
      floatText(h.x, h.y - 22, wild ? 'BUMP!' : 'soft bump', wild ? '#ff9a7a' : '#9ad8ff');
    }

}

/* ============================================================== main hobo, launching and landing */
function launch(d) {
  const f = flap(), x0 = clamp(wrapX(flapCenter(G.closed)), HR, W - HR);
  const wobble = Math.min(10 + G.streak * 2, 55);
  const v = launchSpeed(G.streak);
  // land LEFT in the hole -> next hobo goes RIGHT. Scaled down for fast launches so the hobo still comes
  // back down within reach of the dumpster (a higher launch means a longer flight).
  const vx = (-FLING * d + rand(-1, 1) * wobble) * Math.min(1, 700 / v);
  G.air = { who: G.inside, x: x0, y: DTOP - 24, vx, vy: -v, t: 0, bonked: false, chute: null, cd: 0 };
  G.lid[G.closed] = .55; G.slam = .18;
  burst(x0, DTOP - 8, 12, ['#ddd', '#a8a8b8', '#fff'], 180, .45);
  sfx.launch();
}
function swapFlaps() { G.closed = opp(G.closed); }

function steer(dt) {
  const f = flap(), open = opp(G.closed), off = open === 'L' ? -f / 2 : f / 2;
  if (G.turboT > 0) {
    // TURBO: no slow start. Arrows go straight to full speed and stop the instant you let go;
    // a cursor or finger gets a near-instant slide (about a tenth of a second across the screen).
    if (keyDir) G.v = keyDir * TURBO_KEY_V;
    else if (target != null) {
      const want = validX(target - off, G.closed, f);                  // aim only at spots where the whole hole stays on screen
      const d = want - G.x; G.v = clamp(d, -TURBO_SLIDE * dt, TURBO_SLIDE * dt) / dt;
    }
    else G.v = 0;
    G.x += G.v * dt;
  } else {
    let vDes = 0;
    if (keyDir) vDes = keyDir * ST.maxV;
    else if (target != null) {
      const d = (target - off) - G.x;              // the cursor positions the HOLE, not the dumpster centre
      vDes = Math.sign(d) * Math.min(ST.maxV, Math.sqrt(2 * ST.decel * Math.abs(d)) * .9);
      if (Math.abs(d) < 2) vDes = 0;
    }
    const dv = vDes - G.v;
    const braking = G.v !== 0 && Math.sign(dv) !== Math.sign(G.v);
    const rate = braking ? ST.decel : ST.accel;
    G.v += clamp(dv, -rate * dt, rate * dt);
    if (!keyDir && target != null && Math.abs((target - off) - G.x) < 3 && Math.abs(G.v) < 30) G.v = 0;
    G.x += G.v * dt;
  }
  const vx = validX(G.x, G.closed, f);
  if (vx !== G.x) {
    const diff = vx - G.x;
    if (Math.abs(diff) <= 3 + Math.abs(G.v) * dt * 1.5) { G.x = vx; if (Math.sign(diff) !== Math.sign(G.v)) G.v = 0; }
    else G.x += clamp(diff, -520 * dt, 520 * dt);   // a flap swap left the new hole straddling the edge: slide it in
  }
}

function enterZone(z) {
  G.zone = z; const Z = ZONES[z];

  let bonus = 0;
  if (!S.zonesClaimed.includes(z)) { S.zonesClaimed.push(z); bonus = Math.round(earn(Z.bonus)); }   // first visit this cycle pays a bonus
  G.banner = { text: Z.big || Z.name.toUpperCase(), sub: Z.big ? Z.name + ' - ' + Z.sub : Z.sub, bonus, t: 0, big: !!Z.big };
  if (Z.big) achUnlock('leap', 'One Giant Leap');

}
function updateMain(dt) {

  for (let i = 0; i < n; i++) {

        const m = Math.round(earn(multiplier())); floatText(a.x, DTOP - 40, `+$${m}`, '#ffe27a');
        burst(a.x, DTOP - 6, 10, ['#fff', '#ffe27a'], 160, .4);

        if (G.saverUsed) statAdd('comboSaves');             // landed in the open flap during a combo save
        if (a.hazHit) statAdd('hazBounces');                // bumped by an obstacle earlier in this same flight
        if (a.chute === 'open') statAdd('chute');

        if (G.turboT > 0) statAdd('turbo');

}
function groundHit(a) {

    a.y = GROUND - HR - 1; a.vy = -rand(420, 560);
    // The FIRST net bounce picks a random direction and speed. Every later bounce keeps heading that way, and the side
    // walls turn him around (physics already flips his sideways speed there), so he sweeps predictably back and forth.
    if (!a.netSpeed) a.netSpeed = rand(110, 200);

function cloneVsDumpster(c, prevBottom) {

  if (!(c.vy > 0 && bottom >= level && prevBottom <= level + 6)) return;
  const dh = wd(c.x, flapCenter(opp(G.closed))), dc = wd(c.x, flapCenter(G.closed));
  if (Math.abs(dh) <= f / 2 + 6 && (c.hops || 0) < CLONE_HOPS) {
    c.hops = (c.hops || 0) + 1; statAdd('cloneBounces'); c.hazN = 0;
    c.y = level - HR - 1; c.chute = null;
    c.vy = -launchSpeed(G.streak) * rand(.6, .85);
    c.vx = -FLING * dh + rand(-1, 1) * 30;
    burst(c.x, DTOP - 6, 8, ['#fff', '#ffe27a'], 150, .35);
    floatText(c.x, DTOP - 36, 'BOING!', '#c9a0ff'); sfx.cloneHop();
  } else if (Math.abs(dc) <= f / 2 + 4) {
    c.y = level - HR - 1;
    c.vy = -280; c.vx = (dc < 0 ? -1 : 1) * rand(160, 260);
    sfx.bonk();

}

/* ============================================================== update */
function update(dt) {
  G.time += dt;
  for (const s of ['L', 'R']) G.lid[s] += ((s === G.closed ? 0 : 1) - G.lid[s]) * Math.min(1, dt * 11);
  G.slam = Math.max(0, G.slam - dt); G.shake = Math.max(0, G.shake - dt * 3);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > (G.banner.big ? 4.5 : 3)) G.banner = null; }
  if (G.toasts.length) {                                                                              // achievement pop-ups, one at a time
    G.toastT += dt;
    if (G.toastT > 2.8) {
      G.toasts.shift(); G.toastT = 0;
      if (!G.toasts.length && G.toastMore) { G.toasts.push(`${G.toastMore} more achievements`); G.toastMore = 0; }
    }
  }
  G.wideT = Math.max(0, G.wideT - dt); G.netT = Math.max(0, G.netT - dt);
  if (G.turboT > 0) {
    G.turboT -= dt;
    if (G.turboT <= 0) { G.turboT = 0; G.v = clamp(G.v, -ST.maxV, ST.maxV); }     // back to the slow, heavy dumpster
    else if (G.parts.length < 400 && Math.random() < .6)                         // sparks fly off while it is on
      G.parts.push({ x: G.x + rand(-G.dw / 2, G.dw / 2), y: DTOP + rand(0, 60), vx: rand(-60, 60) - G.v * .15, vy: rand(-220, -60), life: .4, max: .4, c: pick(['#ffe27a', '#fff', '#9ad8ff']), s: rand(2, 4) });
  }
  G.dw += (targetDw() - G.dw) * Math.min(1, dt * 6);

  // camera follows the airborne hobo up and back down
  // the camera follows the main hobo; once he has splatted but clones are still up, it follows the lowest clone instead
  let follow = G.air;
  if (!follow && G.phase === 'dead' && G.clones.length) {
    // stay on one clone until it lands; then pick the highest remaining (the newest, if they are level)
    if (!G.camClone || !G.clones.includes(G.camClone)) {
      let best = G.clones[0];
      for (const c of G.clones) if (c.y < best.y - 1 || Math.abs(c.y - best.y) <= 1) best = c;
      G.camClone = best;
    }
    follow = G.camClone;
  }
  const camTarget = follow ? Math.min(0, follow.y - 330) : 0;
  const camK = clamp(9 + (follow ? Math.abs(follow.vy) / 150 : 0), 9, 30);   // tighter follow when he is flying fast
  G.camY += (camTarget - G.camY) * Math.min(1, dt * camK);

  if (G.objs.some(o => o.dead)) G.objs = G.objs.filter(o => !o.dead);          // things a lightning bolt took
  for (const B of G.bolts) B.t += dt;
  if (G.bolts.length && G.bolts[0].t > .9) G.bolts.shift();
  // everything in the air flies in from the side and flies out the other
  for (let i = G.objs.length - 1; i >= 0; i--) {
    const o = G.objs[i]; o.age += dt; o.cd = Math.max(0, o.cd - dt); o.x += o.vx * dt;
    o.y = o.y0 + Math.sin(o.age * o.bobF + o.ph) * o.bobA;
    if (o.x < -70 || o.x > W + 70) G.objs.splice(i, 1);
  }
  if (G.phase !== 'over') {
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      const density = clamp(apexOf(launchSpeed(G.streak)) / 600, 1, 3.5);     // more loot to fill a taller climb
      spawnObject(false); G.spawnT = .3 / density; if (G.objs.length > 200) G.objs.shift();
    }
  }

  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.life -= dt; if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.life -= dt * 1.1; f.y -= 40 * dt; if (f.life <= 0) G.floats.splice(i, 1); }
  for (let i = G.hudFloats.length - 1; i >= 0; i--) { G.hudFloats[i].life -= dt; if (G.hudFloats[i].life <= 0) G.hudFloats.splice(i, 1); }
  for (let i = G.splats.length - 1; i >= 0; i--) { const s = G.splats[i]; s.t += dt; if (s.t > 3) G.splats.splice(i, 1); }

  // clones live their own lives, on screen or off
  for (let i = G.clones.length - 1; i >= 0; i--) {
    const c = G.clones[i];
    const n = clamp(Math.ceil(Math.hypot(c.vx, c.vy) * dt / 18), 1, 16), h = dt / n;
    for (let k = 0; k < n; k++) {
      const prevBottom = c.y + HR;
      physics(c, h); touchObjects(c, false);
      cloneVsDumpster(c, prevBottom);
      if (c.y + HR >= GROUND) {
        statAdd('cloneSplats');
        G.splats.push({ x: c.x, t: 0, pal: c.pal, big: false });
        burst(c.x, GROUND - 6, 10, ['#fff', '#ffe27a'], 200, .5); sfx.cloneSplat();
        G.clones.splice(i, 1);
        break;
      }
    }
  }

  // the dumpster holds still for the opening jump so he lands cleanly; and it stays live after the main hobo splats,
  // for as long as clones are still in the air, so you can keep bouncing them
  if (G.phase === 'fly' || (G.phase === 'dead' && G.clones.length)) steer(dt);
  if (G.phase === 'jump') {
    G.v = 0;
    G.jumpT += dt / .42;
    if (G.jumpT >= 1) {
      launch(0); G.inside = G.jumper; swapFlaps(); sfx.slam(); G.shake = .25; G.phase = 'fly';
    }
  } else if (G.phase === 'fly' && G.air) updateMain(dt);
  else if (G.phase === 'dead') {
    // like pinball extra balls: the run ends once the splat has been seen AND every clone is down.
    // The 3-minute limit only guards against a clone that somehow never lands (a legit multiball finishes well within it).
    G.overT -= dt; G.deadT = (G.deadT || 0) + dt;
    if (G.overT <= 0 && (G.clones.length === 0 || G.deadT > 180)) endRun();
  }
}

function endRun() {
  G.phase = 'over';
  S.cash += Math.floor(G.cash);
  const newBest = Math.floor(G.cash) > S.bestCash; if (newBest) S.bestCash = Math.floor(G.cash);
  const peak = Math.round(G.maxAlt / 10), newPeak = peak > S.bestAlt; if (newPeak) S.bestAlt = peak;
  save();
  showMenu({ cash: Math.floor(G.cash), catches: G.catches, streak: G.bestStreak, peak, who: HOBOS[G.deadWho].name, newBest, newPeak, zone: G.zone, ach: G.newAch });
}

const hash01 = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };

  const BAND = 120, a0 = Math.max(700, altBot - 120), a1 = Math.min(3200, altTop + 120);
  for (let k = Math.floor(a0 / BAND); k <= Math.floor(a1 / BAND); k++) {
    const h1 = hash01(k), h2 = hash01(k + 91), h3 = hash01(k + 313);
    if (h1 < .35) continue;
    const alt = k * BAND + h2 * BAND, y = DTOP - alt;
    const fade = clamp((alt - 700) / 300, 0, 1) * clamp((3200 - alt) / 500, 0, 1);
    const sp = (h3 - .5) * 26, x = (((h1 * 1000 + sp * G.time) % (W + 320)) + (W + 320)) % (W + 320) - 160, s = .8 + h3 * 1.3;
    ctx.save(); ctx.globalAlpha = .5 * fade; ctx.fillStyle = '#eef3ff';

    for (const [dx, dy, rx, ry] of [[0, 0, 54, 17], [-34, 5, 36, 14], [36, 4, 40, 15], [4, -12, 32, 15]]) {

}

  const drawSplats = () => { for (const s of G.splats) {
    const k = Math.min(1, s.t * 6), fade = clamp(1 - (s.t - 2), 0, 1), sc = s.big ? 1 : .6;
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(s.x, GROUND - 3);
    ctx.fillStyle = s.pal.coat; ctx.beginPath(); ctx.ellipse(0, 0, 30 * k * sc, 7 * k * sc, 0, 0, 7); ctx.fill();
    ctx.fillStyle = s.pal.skin; ctx.beginPath(); ctx.arc(-6 * k * sc, -2, 6 * k * sc, 0, 7); ctx.fill();
    ctx.strokeStyle = s.pal.pants; ctx.lineWidth = 4 * sc; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-24 * k * sc, 0); ctx.lineTo(-38 * k * sc, 3); ctx.moveTo(24 * k * sc, 0); ctx.lineTo(40 * k * sc, -1); ctx.stroke();
    if (s.big) {
      ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
      for (let i = 0; i < 3; i++) { const an = s.t * 5 + i * 2.1; ctx.fillText('★', Math.cos(an) * 22, -22 + Math.sin(an) * 6); }
      ctx.font = '900 26px system-ui'; ctx.lineWidth = 5; ctx.strokeStyle = '#3a0d00'; ctx.fillStyle = '#ffcf4a';
      const ty = -48 - Math.min(s.t, .6) * 30, tx = clamp(s.x, 62, W - 62) - s.x; ctx.strokeText('SPLAT!', tx, ty); ctx.fillText('SPLAT!', tx, ty);
    }
    ctx.restore();
  } };
  // safety net: springy ground
  if (G.netT > 0) {
    const p = .55 + Math.sin(G.time * 10) * .25, fade = Math.min(1, G.netT / 1.2);
    ctx.save(); ctx.globalAlpha = fade * p;
    const ng = ctx.createLinearGradient(0, GROUND - 22, 0, GROUND + 6); ng.addColorStop(0, 'rgba(120,220,255,0)'); ng.addColorStop(1, 'rgba(120,220,255,.85)');
    ctx.fillStyle = ng; ctx.fillRect(0, GROUND - 22, W, 28);
    ctx.strokeStyle = '#bff0ff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= W; x += 18) ctx.lineTo(x, GROUND - 3 + ((x / 18) % 2 ? -6 : 0)); ctx.stroke();
    ctx.restore();
  }
  // dumpster (drawn at every wrapped copy that touches the screen)
  const xs = copies(G.x, G.dw / 2 + 14);
  if (G.turboT > 0) {                               // electric glow under the dumpster while turbo is on
    const gl = .4 + Math.sin(G.time * 14) * .12, fade = Math.min(1, G.turboT / .8);
    for (const xx of xs) {
      const g = ctx.createRadialGradient(xx, DTOP + 34, 6, xx, DTOP + 34, G.dw * .95);
      g.addColorStop(0, `rgba(255,236,120,${gl * fade})`); g.addColorStop(1, 'rgba(255,236,120,0)');
      ctx.fillStyle = g; ctx.fillRect(xx - G.dw, DTOP - G.dw * .6, G.dw * 2, G.dw * 1.6);
    }
  }
  for (const xx of xs) drawDumpsterAt(xx);
  if (G.phase === 'ready') {
    const bob = Math.sin(G.time * 3) * 1.2;
    for (const xx of copies(flapCenter(G.closed), 20)) drawHobo(xx, DTOP - 28 + bob, 0, G.time, HOBOS[G.jumper].pal, 'stand');
  } else if (G.phase === 'jump') {
    const u = clamp(G.jumpT, 0, 1), from = flapCenter(G.closed), to = flapCenter(opp(G.closed));
    const hx = lerp(from, to, u), hy = DTOP - 22 - Math.sin(Math.PI * u) * 80;
    for (const xx of copies(hx, 20)) drawHobo(xx, hy, (to > from ? 1 : -1) * Math.sin(Math.PI * u) * .5, G.time, HOBOS[G.jumper].pal, 'fly');
  }
  for (const xx of xs) drawFlapsAt(xx);

  for (const c of G.clones) drawHoboFlying(c, c.pal, 1.05);
  if (G.air) drawHoboFlying(G.air, HOBOS[G.air.who].pal, 1.3);
  drawSplats();                                     // on top of the dumpster and the hobos, so a splat is always visible

  for (const p of G.parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = '900 20px system-ui'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
  for (const f of G.floats) {
    const tx = clamp(f.x, 70, W - 70); ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.strokeText(f.txt, tx, f.y); ctx.fillStyle = f.col; ctx.fillText(f.txt, tx, f.y);
  }
  ctx.globalAlpha = 1;
}

function hudText(txt, x, y, size, col, align = 'left') {
  ctx.font = `900 ${size}px system-ui`; ctx.textAlign = align; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.75)';
  ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y);
}
function drawHud() {
  hudText(`$${money(G.cash)}`, 14, 38, G.cash >= 1e6 ? 26 : 32, '#7dffa0');
  let hy = 62;
  for (const f of G.hudFloats) { ctx.globalAlpha = clamp(f.life, 0, 1); hudText(f.txt, 16, hy, 16, f.col); hy += 18; }
  ctx.globalAlpha = 1;
  // active power-ups
  let py = 64 + G.hudFloats.length * 18 + 6;
  const bar = (icon, frac, col) => {
    ctx.font = '18px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(icon, 14, py + 14);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(40, py + 5, 70, 8);
    ctx.fillStyle = col; ctx.fillRect(40, py + 5, 70 * clamp(frac, 0, 1), 8); py += 24;
  };
  if (G.wideT > 0) bar('↔️', G.wideT / PU_TIME, '#9ad8ff');
  if (G.turboT > 0) bar('⚡', G.turboT / ST.turboTime, '#ffe27a');
  if (G.netT > 0) bar('🥅', G.netT / ST.netTime, '#9ad8ff');
  if (G.air && G.air.thrust > 0) bar('🚀', G.air.thrust / ST.burn, '#ff9a4a');
  if (G.saver) bar('🛡️', 1, G.saverUsed && Math.floor(G.time * 6) % 2 ? '#ffb347' : '#ffe27a');
  if (G.clones.length) bar('👥', G.clones.length / CLONE_CAP, '#c9a0ff');

  if (G.phase === 'fly' || G.phase === 'dead') {
    const m = multiplier();
    hudText(`${G.streak} bounce${G.streak === 1 ? '' : 's'}${m > 1 ? `  ×${m}` : ''}`, W / 2 + 14, 32, 20, '#ffe27a', 'center');
    const alt = Math.round(Math.max(0, DTOP - (G.air ? G.air.y : DTOP)) / 10);
    if (G.maxAlt > 40) hudText(`${money(G.maxAlt / 10)} m peak`, W / 2 + 14, 54, 14, 'rgba(255,255,255,.8)', 'center');
    if (G.zone > 0) hudText(ZONES[G.zone].name, W / 2 + 14, 96, 12, '#9ad8ff', 'center');
    if (G.phase === 'dead' && G.clones.length) {          // the run isn't over until the clones are down
      ctx.globalAlpha = .7 + Math.sin(G.time * 8) * .3;
      hudText(`${G.clones.length} clone${G.clones.length === 1 ? '' : 's'} still flying!`, W / 2, 130, 20, '#c9a0ff', 'center');
      ctx.globalAlpha = 1;
    }
    // launch power: fills as bounces build up toward this level's ceiling
    const pf = launchFrac(G.streak), bx = W / 2 - 31, by = 62;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx, by, 90, 7);
    ctx.fillStyle = pf > .9 ? '#ffe27a' : '#7dffa0'; ctx.fillRect(bx, by, 90 * pf, 7);
    ctx.font = '800 9px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(pf > .9 ? 'MAX POWER' : 'POWER', W / 2 + 14, by + 17);
  }
  // the hole indicator: when the dumpster scrolls out of view, a thick line shows where the open hole is
  const dumpTopScreen = DTOP - G.camY;
  const vis = clamp((dumpTopScreen - (H - 40)) / 90, 0, 1);
  if (vis > 0 && G.phase !== 'ready') {
    const f = flap(), hc = wrapX(flapCenter(opp(G.closed))), y = H - 16;
    ctx.save(); ctx.globalAlpha = vis; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,207,74,.28)'; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(hc - f / 2 + 4, y); ctx.lineTo(hc + f / 2 - 4, y); ctx.stroke();
    ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(hc - f / 2 + 4, y); ctx.lineTo(hc + f / 2 - 4, y); ctx.stroke();
    ctx.restore();
  }
  drawBolts();
  if (G.toasts.length && !menuOpen) {               // achievement toast: slides in, holds, fades out
    const a = clamp(Math.min(G.toastT / .25, (2.8 - G.toastT) / .5), 0, 1), txt = '🏆 ' + G.toasts[0];
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 160 - (1 - a) * 14);
    ctx.font = '800 15px system-ui'; const tw = Math.min(W - 24, ctx.measureText(txt).width + 36);
    ctx.fillStyle = 'rgba(12,14,30,.88)'; rr(ctx, -tw / 2, -20, tw, 40, 12); ctx.fill();
    ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2; rr(ctx, -tw / 2, -20, tw, 40, 12); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(txt, 0, 5);
    if (G.toasts.length > 1) { ctx.font = '700 11px system-ui'; ctx.fillStyle = '#ffcf4a'; ctx.fillText(`+${G.toasts.length - 1} more`, 0, 32); }
    ctx.restore();
  }
  if (G.banner) {                                   // zone banner: pops in, holds, fades out
    const b = G.banner, dur = b.big ? 4.5 : 3, a = Math.min(1, b.t / .25, (dur - b.t) / .7), pop = 1 + Math.max(0, .35 - b.t) * 1.2;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, b.big ? 250 : 215); ctx.scale(pop, pop);
    if (b.big) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(-W / 2, -48, W, 150); }
    hudText(b.text, 0, 0, b.big ? 44 : 34, b.big ? '#ffe27a' : '#fff', 'center');
    hudText(b.sub, 0, 30, 16, '#9ad8ff', 'center');
    if (b.bonus) hudText(`ZONE BONUS  +$${money(b.bonus)}`, 0, 62, 22, '#7dffa0', 'center');
    if (b.big) hudText('ACHIEVEMENT UNLOCKED', 0, 90, 14, '#ffb347', 'center');
    ctx.restore();
  }
  if (G.phase === 'ready' && !menuOpen) {
    ctx.globalAlpha = .6 + Math.sin(G.time * 5) * .4;
    hudText('TAP · CLICK', W / 2, 200, 38, '#fff', 'center');
    hudText('or press ← →', W / 2, 238, 26, '#fff', 'center');
    ctx.globalAlpha = .85;
    hudText('then steer: the hole chases', W / 2, 282, 16, '#ffe27a', 'center');
    hudText('your cursor or finger', W / 2, 303, 16, '#ffe27a', 'center');
    ctx.globalAlpha = 1;
  }
  if (paused && !menuOpen) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    hudText('PAUSED', W / 2, H / 2 - 6, 54, '#fff', 'center');
    hudText('tap, click or press a key', W / 2, H / 2 + 30, 18, '#ffe27a', 'center');
  }
}

/* ============================================================== menu / shop (DOM) */
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
const title = document.getElementById('title');
document.getElementById('ver').textContent = versionText();
function titleOpen() { return !title.classList.contains('hidden'); }
function showTitle() { menuOpen = true; overlay.classList.add('hidden'); title.classList.remove('hidden'); }
/* START: if you can afford an upgrade you land in the shop first; otherwise you go straight into a run. */
function startFromTitle() {
  audio(); title.classList.add('hidden');
  if (UPGRADES.some(u => S[u.id] < u.max && S.cash >= costOf(u))) showMenu(null); else startRun();
}
document.getElementById('start').addEventListener('click', startFromTitle);
/* The achievements page: one collapsible row per category, showing the next goal with a progress bar; tap to see every tier. */
function showAchievements() {
  menuOpen = true; title.classList.add('hidden'); overlay.classList.remove('hidden');
  const cats = ACH_CATS.map(c => {
    const done = c.items.filter(it => S.ach[it.id]).length, next = c.items.find(it => !S.ach[it.id]);
    const cur = c.counter ? (S.stats[c.counter] || 0) : 0;
    const pct = next && c.counter ? clamp(cur / next.need * 100, 0, 100) : (done === c.items.length ? 100 : 0);
    const goal = !next ? 'All done! 🎉' : (c.counter ? `Next: ${next.short} (${money(cur)} / ${money(next.need)})` : `Next: ${next.short}`);
    return `<details class="achcat${done === c.items.length ? ' complete' : ''}"><summary><div class="achhead"><b>${c.name}</b><span>${done}/${c.items.length}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="lv">${goal}</div></summary>
      ${c.items.map(it => `<div class="it ${S.ach[it.id] ? 'done' : 'lock'}"><b>${S.ach[it.id] ? '✓' : '🔒'} ${it.short}</b><small>${it.desc}</small></div>`).join('')}</details>`;
  }).join('');
  card.innerHTML = `<h1>🏆 ACHIEVEMENTS</h1><p class="sub"><b>${achCount()}</b> of ${ACH_ALL.length} unlocked · stats count from the day this feature shipped</p>${cats}
    <button class="go" id="achBack">BACK</button>`;
  card.scrollTop = 0;
}
function rowNote(u, lv) {
  if (u.id === 'height') return `bounces build up to ~${money(apexOf(launchMax(lv)) / 10)} m`;
  if (u.id === 'rocket') return `rockets burn ${burnOf(lv).toFixed(1)} s`;
  if (u.id === 'net') return `net lasts ${netOf(lv).toFixed(1)} s`;
  if (u.id === 'turbo') return `turbo lasts ${turboOf(lv).toFixed(1)} s`;
  if (u.id === 'speed') return `now +${(lv * 4.5).toFixed(lv ? 1 : 0)}% acceleration`;
  return `now +${(lv * 1.6).toFixed(lv ? 1 : 0)}% wider`;
}
function showMenu(res) {
  lastResult = res; menuOpen = true; title.classList.add('hidden'); overlay.classList.remove('hidden');
  const first = !res;
  card.innerHTML = `
    <h1>DUMPSTER DIVERS</h1>
    <p class="sub">${first ? 'Gutter Gary &amp; Dumpy Dave want that trash. Bounce them, grab stuff, don’t hit the pavement.' : 'Another one bites the asphalt.'}</p>
    ${res ? `<div class="result"><b>${res.who}</b> got flattened.<br>
      Earned <b>$${money(res.cash)}</b> · ${res.catches} bounce${res.catches === 1 ? '' : 's'} · best streak ${res.streak}<br>
      Peak <b>${money(res.peak)} m</b>${res.newPeak ? ' <b>(new high!)</b>' : ''}${res.newBest ? ' · <b>best haul!</b>' : ''}<br>
      Reached <b>${ZONES[res.zone || 0].name}</b>${(res.ach || []).slice(0, 8).map(a => `<br>🏆 <b>ACHIEVEMENT: ${a}</b>`).join('')}${(res.ach || []).length > 8 ? `<br>🏆 …and ${(res.ach || []).length - 8} more` : ''}</div>` : ''}
    <div class="cash">Stash: <span>$${money(S.cash)}</span></div>
    ${UPGRADES.map(u => {
      const lv = S[u.id] || 0, maxed = lv >= u.max, cost = costOf(u);
      return `<div class="row"><div class="nm"><b>${u.name}</b><small>${u.desc}</small>
        <div class="bar"><i style="width:${lv / u.max * 100}%"></i></div>
        <div class="lv">Lv ${lv}/${u.max} · ${rowNote(u, lv)}</div></div>
        <button data-buy="${u.id}" ${maxed || S.cash < cost ? 'disabled' : ''}>${maxed ? 'MAX' : '$' + money(cost)}</button></div>`;
    }).join('')}
    <div class="row prestige"><div class="nm"><b>⭐ Rank: ${rankName(S.prestige || 0)}</b>
      <small>Income ×${multAt(S.prestige || 0).toFixed(2)} now. Prestige to become <b>${rankName((S.prestige || 0) + 1)}</b> (×${multAt((S.prestige || 0) + 1).toFixed(2)} forever).
      Resets upgrades and stash to zero. Records stay.</small></div>
      <button id="prestige" ${S.cash < prestigeCost(S.prestige || 0) ? 'disabled' : ''}>$${money(prestigeCost(S.prestige || 0))}</button></div>
    <button class="ach-btn" id="achBtn">🏆 Achievements &nbsp;${achCount()} / ${ACH_ALL.length}</button>
    <button class="go" id="go">${first ? 'DIVE IN' : 'TRY AGAIN'}</button>
    <div class="hint">Steer: move your mouse, drag a finger, or use ← → / A D.<br>Land on the LEFT of the hole and the next hobo flies RIGHT.<br>Best haul $${money(S.bestCash)} · highest ${money(S.bestAlt)} m<br>Furthest zone: ${ZONES[S.bestZone || 0].name}${S.ach.leap ? ' · 🏆 One Giant Leap' : ''}<br><span class="verline">${versionText()}</span></div>
    <button class="reset" id="reset">reset progress</button> &nbsp;·&nbsp; <button class="reset" id="resetAch">reset achievements</button>`;
}
card.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  audio();
  if (b.id === 'go') { startRun(); return; }
  if (b.id === 'achBtn') { showAchievements(); return; }
  if (b.id === 'achBack') { showMenu(lastResult); return; }
  if (b.id === 'prestige') {
    const n = S.prestige || 0, cost = prestigeCost(n);
    if (S.cash < cost) return;
    if (confirm(`Prestige to ${rankName(n + 1)}?\n\nYou pay $${money(cost)}. Your upgrades and stash reset to zero, and your income becomes ×${multAt(n + 1).toFixed(2)} forever.\nRecords and achievements are kept.`)) {
      for (const u of UPGRADES) S[u.id] = 0;
      S.cash = 0; S.prestige = n + 1; S.zonesClaimed = [];
      save(); sfx.leap(); showMenu(null);
    }
    return;
  }
  if (b.id === 'reset') {                           // wipes the economy only: achievements, lifetime counters and records are kept
    if (confirm('Reset your stash, upgrades and rank back to zero?\n\nYour achievements, lifetime counters and records are KEPT.')) {
      for (const u of UPGRADES) S[u.id] = 0;
      S.cash = 0; S.prestige = 0; S.zonesClaimed = [];
      save(); showMenu(null);
    }
    return;
  }
  if (b.id === 'resetAch') {                        // wipes achievements and lifetime counters only: progress is kept
    if (confirm('Erase ALL achievements and lifetime counters?\n\nYour stash, upgrades and rank are KEPT.')) {
      S.ach = {}; S.stats = {}; S.achBackfill = true;     // (backfill flag: the one-time credit for old records must not give them straight back)
      save(); showMenu(null);
    }
    return;
  }
  const id = b.dataset.buy; if (!id) return;
  const u = UPGRADES.find(x => x.id === id), cost = costOf(u);
  if (S[id] < u.max && S.cash >= cost) {
    S.cash -= cost; S[id]++; save(); sfx.coin(); checkMaxUps();
    const st = card.scrollTop; showMenu(lastResult); card.scrollTop = st;
  }
});
function startRun() {
  audio(); newRun(); paused = false; target = null; keyDir = 0; keys.left = keys.right = false;
  menuOpen = false; overlay.classList.add('hidden');
}

/* ============================================================== main loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  updateThrustSound();
  if (G) {
    if (!menuOpen && !paused) update(dt);
    else if (menuOpen) {                                 // idle animation behind the menu
      G.time += dt;
      for (const o of G.objs) { o.age += dt; o.x += o.vx * dt; o.y = o.y0 + Math.sin(o.age * o.bobF + o.ph) * o.bobA; if (o.x < -70 || o.x > W + 70) o.x = o.vx > 0 ? -60 : W + 60; }
      for (const s of ['L', 'R']) G.lid[s] += ((s === G.closed ? 0 : 1) - G.lid[s]) * Math.min(1, dt * 11);
      G.splats.length = 0; G.camY += (0 - G.camY) * Math.min(1, dt * 6);
    }
    const sc = cv.width / W;
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.save();
    if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * 6, rand(-1, 1) * G.shake * 6);
    ctx.save(); ctx.translate(0, -G.camY); drawWorld(); ctx.restore();
    ctx.restore();
    drawHud();
  }
  requestAnimationFrame(frame);
}

// Wake the audio on any kind of tap or key (iPhones only count some of them), and again when the tab comes back to the front
for (const ev of ['touchend', 'click', 'keydown', 'pointerup'])
  window.addEventListener(ev, () => { audio(); const v = document.getElementById('ver'); if (v) v.textContent = versionText(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) audio(); });
// credit what is already earned before this feature existed: height records and maxed upgrades
if (!S.achBackfill) { statMax('height', S.bestAlt || 0); checkMaxUps(); S.achBackfill = true; save(); }   // one time only, so "reset achievements" sticks
newRun();
showTitle();
requestAnimationFrame(frame);

// small hook so the game can be driven by automated tests
window.__dd = { get G() { return G; }, get st() { return ST; }, get S() { return S; }, ACH_CATS, ACH_ALL, statAdd, statMax, strikeLightning, boltDist, boltBuffers, playBolt, BANKS, playBank, get ac() { return ac; }, SOUNDS, get thrustAudio() { return thrustA; }, startRun, W, H, DTOP, update: dt => update(dt), spawnObject, applyPowerUp,
  setTarget: x => { target = x; keyDir = 0; }, showMenu, prestigeCost, launchSpeed, costOf, UPGRADES, newRun, begin };
})();
</script>
